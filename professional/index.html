<title>White Lion School Management System | Professional Edition</title>
<!-- System font fallbacks keep the portal readable without external font downloads. -->
<style>
/* Layout: deep-navy sidebar with gold monogram, cool-grey workspace, blue actions; sidebar becomes a top bar on phones. */
:root {
    --bg: #f3f5f9;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --ink: #172033;
    --ink-strong: #0b1426;
    --muted: #5b6980;
    --line: #e2e7ef;
    --accent: #15345b;
    --accent-ink: #ffffff;
    --accent-soft: #e8eef6;
    --gold: #b88a2b;
    --gold-soft: #faf1dc;
    --good: #0b8f63;
    --good-soft: #def5ec;
    --good-solid: #087a54;
    --warn: #a55f00;
    --warn-soft: #fdf0d5;
    --bad: #c62f2f;
    --bad-soft: #fbe6e6;
    --bad-solid: #c62f2f;
    --on-solid: #ffffff;
    --dark-btn: #14213d;
    --field: #ffffff;
    --field-line: #c9d2e0;
    --scrim: rgba(8, 14, 28, 0.62);
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --nav-bg: #0c1830;
    --nav-line: rgba(255, 255, 255, .08);
    --nav-ink: #a3b3d1;
    --nav-hover: rgba(255, 255, 255, .06);
    --nav-active: rgba(91, 140, 255, .18);
    --nav-gold: #e2b455;
    --paper: #ffffff;
    --paper-ink: #1d2433;
    --paper-muted: #5a6577;
    --paper-line: #c9d1de;
    --paper-head: #eef2f8;
    --font-display: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #0a101d;
        --surface: #111a2c;
        --surface-2: #16213a;
        --ink: #d5ddec;
        --ink-strong: #f2f5fb;
        --muted: #8c9bb5;
        --line: #233050;
        --accent: #5b8cff;
        --accent-ink: #08142e;
        --accent-soft: #16264d;
        --gold: #e2b455;
        --gold-soft: #3a2d10;
        --good: #3ddba0;
        --good-soft: #0f3a2c;
        --good-solid: #34c994;
        --warn: #f0b24b;
        --warn-soft: #3a2a0c;
        --bad: #ff7a7a;
        --bad-soft: #471d22;
        --bad-solid: #ff8a8a;
        --on-solid: #08121f;
        --dark-btn: #2a3a5e;
        --field: #0d1527;
        --field-line: #34456b;
        --scrim: rgba(2, 6, 14, 0.78);
        --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        --nav-bg: #070d1b;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #0a101d;
    --surface: #111a2c;
    --surface-2: #16213a;
    --ink: #d5ddec;
    --ink-strong: #f2f5fb;
    --muted: #8c9bb5;
    --line: #233050;
    --accent: #5b8cff;
    --accent-ink: #08142e;
    --accent-soft: #16264d;
    --gold: #e2b455;
    --gold-soft: #3a2d10;
    --good: #3ddba0;
    --good-soft: #0f3a2c;
    --good-solid: #34c994;
    --warn: #f0b24b;
    --warn-soft: #3a2a0c;
    --bad: #ff7a7a;
    --bad-soft: #471d22;
    --bad-solid: #ff8a8a;
    --on-solid: #08121f;
    --dark-btn: #2a3a5e;
    --field: #0d1527;
    --field-line: #34456b;
    --scrim: rgba(2, 6, 14, 0.78);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --nav-bg: #070d1b;
    color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
#root { height: 100%; }
button, input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { flex-shrink: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.strong { font-weight: 600; color: var(--ink-strong); }

.app-container { display: flex; height: 100%; width: 100%; }

/* Brand mark */
.monogram { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(145deg, #1d3263, #0c1830); color: #e2b455; border: 1px solid rgba(226, 180, 85, .55); font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .5px; flex-shrink: 0; }
.monogram-sm { width: 32px; height: 32px; font-size: 12px; }

/* Sidebar */
aside { width: 256px; background: var(--nav-bg); color: var(--nav-ink); display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; border-bottom: 1px solid var(--nav-line); }
.brand-text { min-width: 0; }
.brand h1 { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: #fff; line-height: 1.25; overflow-wrap: anywhere; }
.brand p { font-size: 11px; color: var(--nav-gold); margin-top: 2px; letter-spacing: .3px; }
.nav-links { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav-btn { display: flex; align-items: center; gap: 12px; background: transparent; border: none; color: var(--nav-ink); text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; width: 100%; }
.nav-btn:hover { background: var(--nav-hover); color: #fff; }
.nav-btn.active { background: var(--nav-active); color: #fff; font-weight: 600; }
.nav-btn.active .icon { color: var(--nav-gold); }
.sidebar-footer { padding: 14px 16px 16px; border-top: 1px solid var(--nav-line); font-size: 11.5px; }
.sync-box { display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 10px; }
.sync-state { display: flex; align-items: center; gap: 8px; color: #dbe5f8; font-weight: 600; }
.sync-note { color: var(--nav-ink); padding-left: 16px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.online { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .18); }
.status-dot.offline { background: #f59e0b; }
.logout-btn { background: none; border: 1px solid var(--nav-line); color: #fca5a5; text-align: center; padding: 8px; cursor: pointer; font-weight: 600; width: 100%; border-radius: 8px; font-size: 12.5px; }
.logout-btn:hover { background: var(--nav-hover); }

/* Workspace */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 36px 20px; overflow-y: auto; background: var(--bg); }
.main-inner { width: 100%; max-width: 1180px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
header h2 { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: -.3px; color: var(--ink-strong); line-height: 1.2; }
header p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.user-chip { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 16px 5px 5px; box-shadow: var(--shadow); }
.user-chip div { display: flex; flex-direction: column; line-height: 1.2; }
.user-chip strong { font-size: 13px; color: var(--ink-strong); }
.user-chip span { font-size: 11px; color: var(--muted); }
footer.main-footer { text-align: center; font-size: 11.5px; color: var(--muted); padding-top: 18px; margin-top: 28px; border-top: 1px solid var(--line); }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 12px; flex-shrink: 0; }
.avatar-lg { width: 52px; height: 52px; font-size: 18px; }
.person { display: flex; align-items: center; gap: 12px; min-width: 0; }

/* Cards */
.card { background: var(--surface); padding: 22px 24px; border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 20px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.card-title { font-family: var(--font-display); font-size: 15.5px; font-weight: 700; color: var(--ink-strong); }
.card-desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-action { display: flex; align-items: center; }
.total-line { margin-top: 12px; }
.notice-box { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.notice-box h4 { color: var(--ink-strong); font-family: var(--font-display); font-size: 13.5px; margin-bottom: 4px; }
.notice-box p { color: var(--ink); font-size: 12.5px; line-height: 1.65; }
.section-label { font-family: var(--font-display); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 0 8px; }

/* Dashboard */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.kpi-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
.kpi-icon.tone-good { background: var(--good-soft); color: var(--good); }
.kpi-icon.tone-gold { background: var(--gold-soft); color: var(--gold); }
.kpi-icon.tone-warn { background: var(--warn-soft); color: var(--warn); }
.kpi-body { display: flex; flex-direction: column; min-width: 0; }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.kpi-value { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--ink-strong); line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
.dash-grid-even { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.chart { width: 100%; height: auto; display: block; }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-text { fill: var(--muted); font-size: 10.5px; font-family: var(--font-body); }
.chart-bar { fill: var(--accent); opacity: .55; }
.chart-bar-now { opacity: 1; }
.hbars { display: flex; flex-direction: column; gap: 14px; }
.hbar-row { display: grid; grid-template-columns: minmax(80px, 140px) 1fr auto; gap: 12px; align-items: center; font-size: 12.5px; }
.hbar-label { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { background: var(--surface-2); border-radius: 6px; height: 10px; overflow: hidden; }
.hbar-fill { height: 100%; background: var(--accent); border-radius: 6px; min-width: 3px; }
.hbar-value { font-variant-numeric: tabular-nums; color: var(--ink-strong); font-weight: 600; text-align: right; }
.notice-form { display: flex; gap: 8px; margin-bottom: 14px; }
.notice-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.notice-list li { display: flex; gap: 12px; align-items: flex-start; color: var(--gold); }
.notice-list li div { flex: 1; min-width: 0; }
.notice-list p { color: var(--ink); font-size: 13px; overflow-wrap: anywhere; }
.notice-list span { color: var(--muted); font-size: 11.5px; }
.icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; }
.icon-btn:hover { background: var(--surface-2); color: var(--bad); }

/* Forms and buttons */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: center; }
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 12px; font-weight: 600; color: var(--muted); }
input, select { padding: 10px 12px; border: 1px solid var(--field-line); border-radius: 8px; font-size: 13.5px; background: var(--field); color: var(--ink); width: 100%; min-width: 0; }
input::placeholder { color: var(--muted); opacity: .8; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); outline: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; padding: 10px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: filter .15s, background .15s; white-space: nowrap; }
.btn:hover { filter: brightness(.94); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-success { background: var(--good-solid); color: var(--on-solid); }
.btn-danger { background: var(--bad-solid); color: var(--on-solid); }
.btn-dark { background: var(--dark-btn); color: #fff; }
.btn-quiet { background: var(--surface); color: var(--ink); border-color: var(--field-line); }
.btn-quiet:hover { background: var(--surface-2); filter: none; }
.btn-danger-quiet { background: var(--surface); color: var(--bad); border-color: var(--field-line); }
.span-all { grid-column: 1 / -1; }
.inline-select { width: auto; padding: 7px 10px; font-size: 13px; }
.date-field { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.date-field input { width: auto; padding: 7px 10px; }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search-field { display: flex; align-items: center; gap: 8px; flex: 1 1 240px; min-width: 0; background: var(--field); border: 1px solid var(--field-line); border-radius: 8px; padding: 0 12px; color: var(--muted); }
.search-field input { border: none; box-shadow: none; padding: 9px 0; background: transparent; }
.search-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.search-field input:focus { box-shadow: none; }

/* Tables, badges, rows */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
th.num { text-align: right; }
td { padding: 11px 12px; font-size: 13.5px; border-bottom: 1px solid var(--line); color: var(--ink); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
table.clickable tbody tr { cursor: pointer; }
table.clickable tbody tr:hover td, table.clickable tbody tr:focus-visible td { background: var(--surface-2); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.success { background: var(--good-soft); color: var(--good); }
.badge.danger { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.list-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--surface); }
.list-item .title { font-weight: 600; font-size: 13.5px; color: var(--ink-strong); }
.list-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.muted-inline { font-weight: 400; color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; margin-left: 6px; }
.text-good { color: var(--good); font-weight: 600; }
.text-bad { color: var(--bad); font-weight: 600; }
.row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--field-line); border-radius: 8px; overflow: hidden; }
.seg-btn { background: var(--surface); color: var(--ink); border: none; padding: 7px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.seg-btn + .seg-btn { border-left: 1px solid var(--field-line); }
.seg-btn:hover { background: var(--surface-2); }
.seg-btn.on-good { background: var(--good-solid); color: var(--on-solid); }
.seg-btn.on-bad { background: var(--bad-solid); color: var(--on-solid); }
.summary-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
.chip-good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.chip-bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip-date { margin-left: auto; font-size: 12px; color: var(--muted); }
.empty-state { font-size: 13px; color: var(--muted); padding: 10px 0; }
.empty-block { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.banner { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; font-weight: 500; }

/* Login and gates */
.login-screen { display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; padding: 16px; background: radial-gradient(1100px 560px at 15% -10%, #1d3263 0%, transparent 60%), #0a1326; overflow-y: auto; }
.login-card { background: var(--surface); padding: 36px 32px 28px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 24px 48px -12px rgba(0, 0, 0, .5); text-align: center; border-top: 3px solid #e2b455; }
.login-card .monogram { margin-bottom: 14px; width: 48px; height: 48px; font-size: 17px; }
.login-card h2 { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--ink-strong); }
.login-card .subtitle { font-size: 12.5px; color: var(--muted); margin: 4px 0 22px; }
.login-card label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; text-align: left; }
.login-card select { margin-bottom: 18px; padding: 12px; }
.login-card .signature { font-size: 11px; color: var(--muted); margin-top: 22px; }
.gate-body { display: flex; flex-direction: column; gap: 16px; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.gate-body .gate-note { color: var(--good); font-weight: 600; }
.gate-body .gate-error { color: var(--bad); }

/* Toast */
.toast-region { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: flex-end; pointer-events: none; z-index: 1100; }
.toast { background: #0c1830; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 10px 24px rgba(0, 0, 0, .3); border-left: 4px solid #e2b455; max-width: 420px; }

/* Modals: documents and profiles */
.modal-backdrop { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 780px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .5); }
.modal-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.modal-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--ink-strong); min-width: 0; }
.doc-scroll { overflow: auto; padding: 18px; min-height: 0; }
.profile-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.profile-id { flex: 1; min-width: 160px; }
.profile-id h3 { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--ink-strong); }
.profile-id p { font-size: 12.5px; color: var(--muted); }
.profile-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
.profile-stats div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; }
.stat-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.profile-stats strong { font-family: var(--font-display); font-size: 20px; color: var(--ink-strong); margin-top: 2px; font-variant-numeric: tabular-nums; }
.profile-actions { margin-top: 22px; }
.profile-form { margin-top: 16px; }

function nextAdmissionNumber(students) {
    const highest = students.reduce((max, s) => {

}
const totalDue = (settings) => Object.values(settings.feeStructure).reduce((a, b) => a + (Number(b) || 0), 0);
// Fee position for every student: what is owed, what was paid, what remains.
function buildFeeSummaries(students, fees, settings) {
    const due = totalDue(settings);
    const paidBy = {};
    fees.forEach((f) => { paidBy[f.studentId] = (paidBy[f.studentId] || 0) + Number(f.amount || 0); });
    const out = {};
    students.forEach((s) => {
        const paid = paidBy[s.id] || 0;
        let state;
        if (due > 0)

        .filter((s) => s.class === student.class)
        .map((s) => ({ id: s.id, avg: averageOf(grades.filter((g) => sameId(g.studentId, s.id))) }))

const csvCell = (v) => {

async function exportCsv(filename, rows) {
    const text = '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\n');
    const claude = window.claude;
    try {
        const dl = claude && claude.use ? await claude.use('downloads') : null;
        if (dl) {
            await dl.save({ filename, data: text });
            return 'saved';
        }
    }
    catch (e) {
        if (e && e.code === 'declined')
            return 'declined';
        return 'unavailable';

    if (!ENABLE_LOCAL)
        return 'unavailable';
    const url = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;

// Persistent state for the standalone build: reads once from localStorage, writes on every change.
function useLocalStorage(key, fallback) {
    const [value, setValue] = useState(() => {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        }
        catch (e) {
            return fallback;
        }
    });
    useEffect(() => {
        try {
            localStorage.setItem(key, JSON.stringify(value));

   students/{id}        one document per student

const recentAttendance = (c) => c.orderBy('date', 'desc').limit(14);
function useLiveCollection(db, path, enabled, onError, build) {
    const [state, setState] = useState({ items: [], loaded: false });
    const errorRef = useRef(onError);
    errorRef.current = onError;
    useEffect(() => {
        if (!db || !enabled) {
            setState({ items: [], loaded: true });
            return undefined;
        }
        setState({ items: [], loaded: false });
        const ref = db.collection(path);
        const query = build ? build(ref) : ref;
        return query.onSnapshot((snap) => setState({ items: snap.docs.map((d) => ({ id: d.id, ...d.data() })), loaded: true }), (err) => { errorRef.current(err); setState((s) => ({ ...s, loaded: true })); });

    return state;
}
function useLiveDoc(db, path, enabled, onError) {
    const [state, setState] = useState({ data: null, loaded: false });
    const errorRef = useRef(onError);

    useEffect(() => {
        if (!db || !enabled) {

            return undefined;

        return db.doc(path).onSnapshot((snap) => setState({ data: snap.exists ? snap.data() : null, loaded: true }), (err) => { errorRef.current(err); setState((s) => ({ ...s, loaded: true })); });

    return state;
}
function flattenEntries(docs) {
    const out = [];
    docs.forEach((d) => {

    });
    return out.sort((a, b) => (a.at || 0) - (b.at || 0));

async function addGroupedEntry(db, collection, studentId, entry) {
    const entryId = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    catch (e) {

function useSharedData(db, myId, isAdmin) {
    const [error, setError] = useState('');

        async addGrade({ studentId, subject, score }) {

        async saveSettings(settings) {
            await db.doc('settings/main').set({ ...settings, updatedBy: myId, at: Date.now() });
        },
        async addNotice(text) {
            await db.collection('notices').doc().set({ text, by: myId, at: Date.now() });

<script>
/* White Lion Professional Edition — safe local-data backup and restore utility.
   This tool never clears local records unless the user explicitly imports a valid backup. */
(function () {
  'use strict';
  var APP_KEYS = {
    wlt_students: 'array',
    wlt_attendance_v2: 'object',
    wlt_grades: 'array',
    wlt_fees: 'array',
    wlt_settings: 'object',
    wlt_notices: 'array'
  };
  function appData() {
    var records = {};
    Object.keys(APP_KEYS).forEach(function (key) {
      try { var raw = localStorage.getItem(key); if (raw !== null) records[key] = JSON.parse(raw); } catch (e) {}
    });
    return records;
  }
  function makeBackup() {
    return { format: 'white-lion-school-backup', schemaVersion: 1, product: 'White Lion School Management System', edition: 'Professional Edition', createdAt: new Date().toISOString(), appData: appData() };
  }
  function downloadJson(obj, name) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob); var a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }
  function validateBackup(data) {
    if (!data || data.format !== 'white-lion-school-backup' || data.schemaVersion !== 1 || !data.appData || typeof data.appData !== 'object' || Array.isArray(data.appData)) throw new Error('This is not a recognised White Lion backup file.');
    var keys = Object.keys(data.appData);
    if (!keys.length) throw new Error('The backup contains no school records.');
    keys.forEach(function (key) {
      if (!Object.prototype.hasOwnProperty.call(APP_KEYS, key)) throw new Error('Unsupported data field in backup: ' + key);
      var val = data.appData[key]; var type = APP_KEYS[key];
      if (type === 'array' && !Array.isArray(val)) throw new Error('The backup has an invalid ' + key + ' field.');
      if (type === 'object' && (!val || typeof val !== 'object' || Array.isArray(val))) throw new Error('The backup has an invalid ' + key + ' field.');
    });
    return keys;
  }
  function add(tag, attrs, text) { var el = document.createElement(tag); Object.keys(attrs || {}).forEach(function (k) { if (k === 'className') el.className = attrs[k]; else el.setAttribute(k, attrs[k]); }); if (text !== undefined) el.textContent = text; return el; }
  function launch() {
    if (document.getElementById('wl-safety-launcher')) return;
    var button = add('button', { id:'wl-safety-launcher', type:'button', 'aria-haspopup':'dialog', 'aria-controls':'wl-safety-overlay' }, '♜  Data Safety & Backup');
    var overlay = add('div', { id:'wl-safety-overlay' });
    var panel = add('section', { id:'wl-safety-panel', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'wl-safety-title' });
    var close = add('button', { type:'button', className:'wl-close', 'aria-label':'Close backup panel' }, 'Close');
    close.addEventListener('click', function(){ overlay.style.display='none'; button.focus(); });
    var title = add('h2', { id:'wl-safety-title' }, 'Data Safety Centre');
    var intro = add('p', {}, 'Create a portable backup of this browser’s White Lion records, or safely restore a previous backup. Keep backup files somewhere separate from this phone.');
    var status = add('div', { className:'wl-status', role:'status', 'aria-live':'polite' }, 'Checking local records…');
    var row = add('div', { className:'wl-row' });
    var exportBtn = add('button', { type:'button', className:'wl-primary' }, 'Download backup (.json)');
    var importBtn = add('button', { type:'button' }, 'Choose backup to restore');
    var file = add('input', { type:'file', accept:'.json,application/json', 'aria-label':'Select a White Lion JSON backup' }); file.style.display='none';
    var note = add('div', { className:'wl-note' }, 'Important: the standalone HTML stores local records in this browser only. It does not automatically synchronise with other devices. Multi-device synchronisation requires a configured shared database and secure user accounts.');
    var note2 = add('p', {}, 'For safety, restore validates the backup and downloads a separate copy of the current records before replacing any imported fields. Do not clear browser data unless you have a verified backup.');
    row.appendChild(exportBtn); row.appendChild(importBtn); panel.appendChild(close); panel.appendChild(title); panel.appendChild(intro); panel.appendChild(status); panel.appendChild(row); panel.appendChild(file); panel.appendChild(note); panel.appendChild(note2); overlay.appendChild(panel); document.body.appendChild(button); document.body.appendChild(overlay);
    function refreshStatus() { var d=appData(); var n=Object.keys(d).length; var count=Array.isArray(d.wlt_students)?d.wlt_students.length:0; status.textContent='Local data fields found: '+n+' • Student records: '+count+' • Storage: this device/browser'; }
    button.addEventListener('click', function(){ refreshStatus(); overlay.style.display='flex'; close.focus(); });
    overlay.addEventListener('click', function(e){ if(e.target===overlay){ overlay.style.display='none'; button.focus(); } });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape' && overlay.style.display==='flex'){ overlay.style.display='none'; button.focus(); } });
    exportBtn.addEventListener('click', function(){ try { var b=makeBackup(); var date=b.createdAt.slice(0,10); downloadJson(b,'White-Lion-School-Backup-'+date+'.json'); status.textContent='Backup prepared. Check your Downloads folder and keep a second copy somewhere safe.'; } catch(e) { status.textContent='Backup could not be created: '+e.message; } });
    importBtn.addEventListener('click', function(){ file.click(); });
    file.addEventListener('change', function(){
      var chosen=file.files && file.files[0]; if(!chosen) return;
      if(chosen.size>15*1024*1024){ status.textContent='This backup is larger than 15 MB and was not imported.'; file.value=''; return; }
      var reader=new FileReader();
      reader.onload=function(){
        try {
          var data=JSON.parse(String(reader.result||'')); var keys=validateBackup(data);
          var msg='Restore '+keys.length+' data section(s) from backup dated '+(data.createdAt||'unknown date')+'? A safety copy of current records will be downloaded first. The app will reload after restore.';
          if(!window.confirm(msg)) { status.textContent='Restore cancelled. Existing records were not changed.'; file.value=''; return; }
          var safety=makeBackup(); downloadJson(safety,'White-Lion-Pre-Restore-Safety-Copy-'+safety.createdAt.slice(0,10)+'.json');
          keys.forEach(function(key){ localStorage.setItem(key, JSON.stringify(data.appData[key])); });
          status.textContent='Restore complete. Reloading the portal…';
          setTimeout(function(){ window.location.reload(); }, 900);
        } catch(e) { status.textContent='Restore stopped: '+(e && e.message ? e.message : 'Could not read the backup.'); }
        file.value='';
      };
      reader.onerror=function(){ status.textContent='Could not read this file. Try selecting the backup again.'; file.value=''; };
      reader.readAsText(chosen);
    });
    refreshStatus();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', launch); else launch();
})();
</script>
